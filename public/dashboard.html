<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — FGG</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .dash { max-width: 52rem; margin: 0 auto; padding: 5rem 1.25rem 6rem; }
    .dash-section { margin-top: 2.25rem; }
    .dash-section h3 { margin-bottom: 0.65rem; }
    .dash h1 { margin-bottom: 0.75rem; font-size: 2.027rem; }
    .login-card {
      border: 1px solid var(--line); border-radius: 16px; padding: 1.5rem;
      background: var(--surface); margin: 1.75rem 0; max-width: 24rem;
    }
    .login-card input {
      width: 100%; padding: 0.75rem 0.95rem; border: 1px solid var(--line);
      border-radius: 12px; background: var(--paper); color: var(--ink);
      font: inherit; margin: 0.75rem 0;
    }

    .pay-section { margin-top: 2.25rem; }
    .pay-row {
      display: flex; gap: 0.65rem; align-items: baseline; flex-wrap: wrap;
      padding: 0.45rem 0; border-bottom: 1px solid var(--line);
      font-size: 0.889rem;
    }
    .pay-row:last-child { border-bottom: 0; }
    .pay-row b { font-family: "Figtree", "Inter", sans-serif; }
    .pay-row .st { color: var(--muted, var(--ink-soft)); }
    .pay-row .st.paid { color: var(--accent); }
    .pay-gen { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.75rem; }
    .pay-gen input {
      flex: 1 1 9rem; padding: 0.55rem 0.75rem;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--paper); color: var(--ink); font: inherit; font-size: 0.889rem;
    }
    #genOut { flex-basis: 100%; word-break: break-all; }

    /* thin strips: dot + count + label, expand in place */
    .strips { display: grid; gap: 0.55rem; margin: 1.25rem 0; }
    .strip { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
    .strip-head {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 1.15rem; cursor: pointer; user-select: none;
    }
    .strip-head .dot { width: 0.65rem; height: 0.65rem; border-radius: 50%; flex-shrink: 0; background: var(--ink-soft); }
    .strip-head .count { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 1.6rem; }
    .strip-head .label { font-weight: 600; letter-spacing: 0.04em; }
    .strip-head .who { color: var(--ink-soft); font-size: 0.889rem; margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; }
    .strip-head .chev { color: var(--ink-soft); transition: transform 140ms ease; flex-shrink: 0; }
    .strip.open .chev { transform: rotate(90deg); }
    .strip-body { display: none; padding: 0 1.15rem 1.15rem; }
    .strip.open .strip-body { display: block; }

    .phase-intake { background: #6b8fd6; }
    .phase-quoted { background: #c9a227; }
    .phase-deposit_paid { background: #7e9c82; }
    .phase-building { background: #dd7a4f; }
    .phase-revision { background: #b07cc6; }
    .phase-launched { background: #2e9e5b; }
    .phase-care { background: #4aa3a3; }

    .kv { margin: 0.35rem 0; font-size: 0.889rem; }
    .kv b { display: inline-block; min-width: 5.5rem; color: var(--ink-soft); font-weight: 500; }
    .qa-row { margin: 0.55rem 0; font-size: 0.889rem; }
    .qa-row .q { color: var(--ink-soft); }
    .files-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0.55rem 0; }
    .files-row a { font-size: 0.85rem; padding: 0.25rem 0.75rem; border: 1px solid var(--line); border-radius: 999px; }
    .empty { color: var(--ink-soft); font-size: 0.889rem; font-style: italic; }
    .stats { display: flex; flex-wrap: wrap; align-items: center; gap: 0.85rem 1.25rem; margin: 0.5rem 0 1.25rem; color: var(--ink-soft); font-size: 0.889rem; }
    .stats b { color: var(--ink); }
  </style>
</head>
<body>
  <a class="login-link" id="authCtl" href="/dashboard"></a>
  <nav class="dots" aria-label="journey">
    <a class="dot" href="/"></a>
    <a class="dot" href="/preferences"></a>
    <a class="dot" href="/payment"></a>
    <a class="dot on" href="/dashboard"></a>
  </nav>

  <main class="dash">
    <h1>Dashboard</h1>

    <div class="login-card" id="loginCard" hidden>
      <b>Sign in</b>
      <button class="button" id="googleBtn" type="button" style="margin:0.9rem 0 0.55rem">Sign in with Google</button>
      <input type="email" id="mailEmail" placeholder="or your email — get a login link" autocomplete="email">
      <button class="button small" id="magicBtn" type="button">Email me a login link</button>
      <details style="margin-top:0.65rem">
        <summary class="empty" style="cursor:pointer">backup key</summary>
        <input type="password" id="dashKey" placeholder="dashboard key" autocomplete="current-password">
        <button class="button small" id="dashLogin" type="button">Enter</button>
      </details>
      <p class="empty" id="loginMsg"></p>
    </div>

    <section class="dash-section" id="meSection" hidden>
      <h3>Personal information</h3>
      <div class="strip"><div class="strip-body" id="meBody"></div></div>
    </section>

    <section class="dash-section" id="sitesSection" hidden>
      <h3>Sites</h3>
      <div class="strip">
        <div class="strip-body" id="sitesList"><p class="empty">no sites yet</p></div>
      </div>
      <div class="pay-gen" id="siteForm">
        <input type="email" id="siteEmail" placeholder="client email">
        <input type="text" id="siteDomain" placeholder="domain (ggagency.com.au)">
        <input type="number" id="siteBuild" placeholder="build $" min="0" step="1" value="200">
        <input type="date" id="siteBuildPaid" title="build paid">
        <input type="number" id="siteCare" placeholder="care $/y" min="0" step="1" value="200">
        <input type="date" id="siteCareFrom" title="care from">
        <button class="button small" id="siteAdd" type="button">Add site</button>
        <p class="empty" id="siteMsg"></p>
      </div>
    </section>

    <div id="app" hidden>
      <h3>Clients</h3>
      <div class="stats" id="stats"></div>
      <div class="strips" id="clients"></div>
    </div>
    <p class="empty" id="loading">loading…</p>
    <section class="dash-section pay-section" id="paySection" hidden>
      <h3>Payments</h3>
      <div class="strip open">
        <div class="strip-body" id="payList"><p class="empty">no payments yet</p></div>
      </div>
      <div class="pay-gen">
        <input type="number" id="genAmount" min="1" max="20000" step="1" placeholder="Amount in $">
        <input type="text" id="genNote" maxlength="80" placeholder="what it's for (optional)">
        <button class="button small" id="genBtn" type="button">Make payment link</button>
        <p class="empty" id="genOut"></p>
      </div>
    </section>

    <section class="dash-section pay-section" id="repSection" hidden>
      <h3>Reports</h3>
      <div class="strip open">
        <div class="strip-body" id="repList"><p class="empty">no reports yet</p></div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    document.addEventListener('dragstart', (e) => {
      if (e.target && e.target.closest && e.target.closest('a, button, .chip, .feature, .s-dot, .dot, .tab')) e.preventDefault();
      });
      document.addEventListener('contextmenu', (e) => {
        if (e.target && e.target.closest && e.target.closest('a, button, .chip, .feature, .s-dot, .dot, .tab, .login-link')) e.preventDefault();
    });
    const q0 = new URLSearchParams(location.search);
    const rawBack = q0.get('from') || '/dashboard';
    const safeBack = (rawBack.startsWith('/') && !rawBack.startsWith('//')) ? rawBack : '/dashboard';

    function esc(s) {
      return String(s == null ? '' : s).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
    }

    function clientStrip(c) {
      const files = (c.files || []).map((f) => '<a href="/files/' + esc(f) + '" target="_blank" rel="noopener">file</a>').join('');
      const qa = (c.qa || []).map((row) => {
        const q = Array.isArray(row) ? row[0] : '';
        const a = Array.isArray(row) ? row[1] : '';
        return a ? '<div class="qa-row"><div class="q">' + esc(q) + '</div><div>' + esc(a) + '</div></div>' : '';
      }).join('');
      return '' +
        '<div class="strip" data-id="' + c.id + '">' +
          '<div class="strip-head" onclick="this.parentNode.classList.toggle(\'open\')">' +
            '<span class="dot phase-' + esc(c.phase) + '"></span>' +
            '<span class="count">' + (c.payCount || 0) + '</span>' +
            '<span class="label">' + esc(c.business || c.name || 'no name') + '</span>' +
            '<span class="who">' + esc(c.email || '') + '</span>' +
            '<span class="chev">&rsaquo;</span>' +
          '</div>' +
          '<div class="strip-body">' +
            '<div class="kv"><b>contact</b>' + esc(c.name) + '</div>' +
            '<div class="kv"><b>email</b>' + esc(c.email) + '</div>' +
            '<div class="kv"><b>phone</b>' + esc(c.phone || '—') + '</div>' +
            '<div class="kv"><b>phase</b>' + esc((c.phase || '').replace('_', ' ')) + '</div>' +
            '<div class="kv"><b>received</b>' + esc(c.created) + '</div>' +
            '<div class="kv"><b>heard via</b>' + esc(c.heard || '—') + '</div>' +
            '<p class="qs-label" style="margin-top:0.95rem">Preferences / brief</p>' +
            (qa || '<p class="empty">no answers yet</p>') +
            '<p class="qs-label" style="margin-top:0.95rem">Files</p>' +
            '<div class="files-row">' + (files || '<span class="empty">no uploads</span>') + '</div>' +
            '<p class="qs-label" style="margin-top:0.95rem">Orders / invoices</p>' +
            '<p class="empty">payments arrive with the Stripe webhook (next slice)</p>' +
            '<p class="qs-label" style="margin-top:0.95rem">Revisions</p>' +
            '<p class="empty">no revision requests yet</p>' +
            '<p class="qs-label" style="margin-top:0.95rem">Care</p>' +
            '<p class="empty">care status arrives with subscriptions (next slice)</p>' +
          '</div>' +
        '</div>';
    }

    function setAuthLabel(label, user) {
      const el = $('authCtl');
      if (!el) return;
      el.textContent = '';
      if (user && user.image) {
        const im = document.createElement('img');
        im.className = 'auth-av';
        im.src = user.image;
        im.alt = '';
        el.appendChild(im);
      }
      el.appendChild(document.createTextNode(label));
    }

    async function load() {
      const r = await fetch('/api/dashboard');
      $('loading').hidden = true;
      if (r.status === 401 || r.status === 403) {
        const me = await fetch('/api/me').then((x) => x.json()).catch(() => ({ user: null }));
        if (me && me.user) {
          setAuthLabel('Log out', me.user);
          $('loginCard').hidden = true;
          $('loading').textContent = 'signed in as ' + String(me.user.email || '').replace(/[<>&"]/g, '') + ' — orders, invoices and revisions will show up here';
          $('loading').hidden = false;
          loadReports();
        } else {
          setAuthLabel('Log in', null);
          $('loginCard').hidden = false;
        }
        return;
      }
      const j = await r.json();
      if (!j.ok) {
        $('loginCard').hidden = false;
        setAuthLabel('Log in', null);
        $('loginMsg').textContent = j.error || 'could not load';
        return;
      }
      $('app').hidden = false;
      const me2 = await fetch('/api/me').then((x) => x.json()).catch(() => ({ user: null }));
      setAuthLabel('Log out', me2.user);
      $('stats').innerHTML = '<span><b>' + j.clients.length + '</b> clients</span>' +
        '<span><b>' + j.intakes + '</b> intakes total</span>' +
        '<span>updated ' + esc(j.now) + '</span>' +
        '<span>via ' + esc((j.user && j.user.email) === 'key' ? 'backup key' : ((j.user && j.user.email) || '—')) + '</span>';
      $('clients').innerHTML = j.clients.map(clientStrip).join('') || '<p class="empty">no clients yet</p>';
      loadReports();
    }

    async function loadReports() {
      const r = await fetch('/api/reports').then((x) => x.json()).catch(() => null);
      if (!r || !r.ok || !Array.isArray(r.reports) || !r.reports.length) return;
      const escR = (x) => String(x || '').replace(/[<>&"]/g, '');
      $('repSection').hidden = false;
      $('repList').innerHTML = r.reports.map((x) => {
        const when = String(x.sent_at || '').slice(0, 10);
        const id = parseInt(x.id, 10) || 0;
        return '<div class="pay-row"><b>' + escR(x.domain) + '</b>' +
          '<span>' + escR(x.period_start) + ' → ' + escR(x.period_end) + '</span>' +
          '<a class="button small" href="/reports/' + id + '">View</a>' +
          '<span>sent ' + escR(when) + '</span></div>';
      }).join('');
    }

    const authCtl = $('authCtl');
    authCtl.addEventListener('click', async (e) => {
      e.preventDefault();
      if (authCtl.textContent === 'Log out') {
        try { await fetch('/api/auth/sign-out', { method: 'POST' }); } catch {}
        try { await fetch('/api/dash-logout', { method: 'POST' }); } catch {}
        $('app').hidden = true;
        $('loginCard').hidden = false;
        $('loginMsg').textContent = '';
        setAuthLabel('Log in', null);
      } else {
        $('loginCard').hidden = false;
        openGoogle();
      }
    });

    const openGoogle = async () => {
      $('loginMsg').textContent = '';
      const r = await fetch('/api/auth/sign-in/social', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ provider: 'google', callbackURL: '/auth-done.html' }),
      });
      const j = await r.json().catch(() => null);
      if (j && j.url) {
        const u = new URL(j.url, location.origin);
        if (!u.searchParams.has('prompt')) u.searchParams.set('prompt', 'select_account');
        const popup = window.open(u.toString(), 'fggauth', 'width=520,height=640');
        if (!popup) window.location.href = u.toString();
      } else $('loginMsg').textContent = 'google sign-in unavailable';
    };
    $('googleBtn').addEventListener('click', openGoogle);
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin || e.data !== 'fgg-auth-done') return;
      $('loginCard').hidden = true;
      load();
    });

    $('magicBtn').addEventListener('click', async () => {
      $('loginMsg').textContent = '';
      const r = await fetch('/api/auth/sign-in/magic-link', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email: $('mailEmail').value, callbackURL: safeBack }),
      });
      if (r.ok) $('loginMsg').textContent = 'sent — check your email for the link';
      else $('loginMsg').textContent = 'could not send — is the email right?';
    });

    $('dashLogin').addEventListener('click', async () => {
      const r = await fetch('/api/dash-login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ key: $('dashKey').value }),
      });
      const j = await r.json();
      if (j.ok) {
        if (safeBack !== '/dashboard') location.replace(safeBack);
        else { $('loginCard').hidden = true; load(); }
      }
      else $('loginMsg').textContent = 'nope';
    });

    load();
  </script>
  <script>
    // payments: what people have paid + a link maker for new requests
    (function () {
      const $ = (id) => document.getElementById(id);
      fetch('/api/payments').then((r) => r.json()).then((j) => {
        if (!j || !j.ok) return;
        const rows = j.payments || [];
        $('paySection').hidden = false;
        if (!rows.length) return;
        const paid = rows.filter((x) => x.status === 'paid');
        const sum = paid.reduce((a, x) => a + (x.amount || 0), 0);
        const esc = (x) => String(x || '').replace(/[<>&"]/g, '');
        $('payList').innerHTML =
          '<div class="pay-row"><b>$' + sum + '</b> paid · ' + paid.length + ' payments · ' + (rows.length - paid.length) + ' pending</div>' +
          rows.map((x) => {
            const when = String(x.paid_at || x.created_at || '').slice(0, 10);
            return '<div class="pay-row"><b>$' + (x.amount || 0) + '</b><span>' + (esc(x.note) || esc(x.mode)) + '</span>' +
              '<span>' + esc(x.email || x.name || '—') + '</span>' +
              '<span class="st' + (x.status === 'paid' ? ' paid' : '') + '">' + esc(x.status) + ' · ' + when + '</span></div>';
          }).join('');
      }).catch(() => {});
      const careRenews = (from) => {
        if (!from) return '—';
        const d = new Date(from);
        d.setFullYear(d.getFullYear() + 1);
        return 'renews ' + d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
      };
      const siteRow = (x) => {
        const esc = (v) => String(v || '—').replace(/[<>&"]/g, '');
        return '<div class="pay-row"><b>' + esc(x.domain) + '</b>' +
          '<span>build $' + (x.build_amount || 0) + ' · paid ' + esc(x.build_paid_at || '—') + '</span>' +
          '<span class="st paid">care $' + (x.care_amount || 0) + '/y · ' + careRenews(x.care_from) + '</span></div>';
      };
      const renderAdminSites = (rows) => {
        const by = {};
        rows.forEach((x) => { (by[x.email] = by[x.email] || []).push(x); });
        $('sitesList').innerHTML = Object.keys(by).map((em) =>
          '<div class="pay-row"><b>' + em.replace(/[<>&"]/g, '') + '</b><span>' + by[em].length + ' site' + (by[em].length > 1 ? 's' : '') + '</span></div>' +
          by[em].map(siteRow).join('')
        ).join('');
        $('sitesSection').hidden = false;
      };
      fetch('/api/sites').then((r) => r.ok ? r.json() : null).then((j) => {
        if (j && j.ok) {
          renderAdminSites(j.sites || []);
          $('siteAdd').addEventListener('click', () => {
            const body = {
              email: $('siteEmail').value,
              domain: $('siteDomain').value,
              build_amount: $('siteBuild').value,
              build_paid_at: $('siteBuildPaid').value,
              care_amount: $('siteCare').value,
              care_from: $('siteCareFrom').value,
            };
            fetch('/api/sites', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
              .then((r) => r.json()).then((jj) => {
                $('siteMsg').textContent = jj && jj.ok ? 'added' : (jj && jj.error) || 'could not add';
                if (jj && jj.ok) return fetch('/api/sites').then((r2) => r2.json()).then((j2) => renderAdminSites(j2.sites || []));
              }).catch(() => { $('siteMsg').textContent = 'could not add'; });
          });
        } else {
          fetch('/api/my-sites').then((r) => r.ok ? r.json() : null).then((mj) => {
            if (!mj || !mj.ok) return;
            $('siteForm').hidden = true;
            $('sitesList').innerHTML = (mj.sites || []).map(siteRow).join('') || '<p class="empty">no sites yet</p>';
            $('sitesSection').hidden = false;
          }).catch(() => {});
        }
      }).catch(() => {});
      fetch('/api/me').then((r) => r.json()).then((j) => {
        if (!j || !j.user) return;
        const u = j.user;
        const esc = (x) => String(x || '').replace(/[<>&"]/g, '');
        $('meSection').hidden = false;
        $('meBody').innerHTML = '<div class="pay-row">' +
          (u.image ? '<img class="auth-av" src="' + esc(u.image) + '" alt="">' : '') +
          '<b>' + esc(u.name || '—') + '</b><span>' + esc(u.email) + '</span><span class="st">' + esc(u.role || 'client') + '</span></div>';
      }).catch(() => {});
      $('genBtn').addEventListener('click', () => {
        const n = Math.round(Number($('genAmount').value || '0'));
        if (!(n >= 1 && n <= 20000)) { $('genOut').textContent = 'enter an amount first'; return; }
        const note = $('genNote').value.trim().replace(/[<>&"]/g, '').slice(0, 80);
        const link = location.origin + '/payment?amount=' + n + (note ? '&for=' + encodeURIComponent(note) : '');
        $('genOut').textContent = link;
        if (navigator.clipboard) navigator.clipboard.writeText(link).catch(() => {});
      });
    })();
  </script>
</body>
</html>
